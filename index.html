<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>YM2151 Web Editor</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="realtime-visualizer" aria-label="Realtime waveform and spectrum display">
        <div class="visualizer-row">
            <div class="visualizer-panel">
                <div class="visualizer-label">Waveform</div>
                <canvas id="realtimeWaveform" width="380" height="120" aria-label="Realtime waveform"></canvas>
            </div>
            <div class="visualizer-panel">
                <div class="visualizer-label">FFT</div>
                <canvas id="realtimeFFT" width="380" height="120" aria-label="Realtime frequency spectrum"></canvas>
            </div>
        </div>
        <div class="visualizer-config">
            <label for="waveformScaleMode"><strong>Waveform vertical scaling:</strong></label>
            <select id="waveformScaleMode">
                <option value="frame-dynamic" selected>Frame-based (expand to 95%)</option>
                <option value="buffer-max">Normalize by overall maximum amplitude</option>
            </select>
        </div>
    </div>

    <h1>YM2151 JSON Editor</h1>
    
    <div class="controls">
        <label for="presetSelect"><strong>Load Preset JSON: </strong></label>
        <select id="presetSelect" onchange="handlePresetChange()">
            <option value="" disabled selected>Loading presets...</option>
        </select>
        <br><br>
        
        <label for="presetToneSelect"><strong>Load Preset Tone: </strong></label>
        <select id="presetToneSelect" onchange="handlePresetToneChange()">
            <option value="" disabled selected>Loading preset tones...</option>
        </select>
        <br><br>
        
        <button onclick="generateRandomTone()" title="Generate a random tone">🎲 Random Tone</button>
        <button onclick="playAudio()">Play</button>
        <button onclick="exportWav()" title="Export the generated audio as a WAV file">Export WAV</button>
        <span class="waveform-preview">
            <canvas id="waveformPreview" width="320" height="80" role="img" aria-label="Rendered waveform preview">Rendered waveform preview</canvas>
        </span>
        <span id="durationInfo" class="duration-display"></span>
        <br><br>
        
        <label>
            <input type="checkbox" id="autoPlayCheckbox">
            Auto-play on edit
        </label>
    </div>

    <div class="storage-controls">
        <button 
            id="storageToggleBtn" 
            class="storage-toggle-btn" 
            aria-controls="storageContent" 
            aria-expanded="false"
            onclick="toggleStorageSection()"
            title="Show/hide save section">
            <span class="toggle-icon" aria-hidden="true"></span>
            <span class="toggle-text">Show Save Section</span>
        </button>
        
        <div id="storageContent" class="storage-content" aria-hidden="true" style="display: none;">
            <div class="storage-section">
                <label for="saveSlotSelect"><strong>Save to Slot: </strong></label>
                <select id="saveSlotSelect">
                    <option value="" disabled selected>Select a slot...</option>
                    <option value="1">Slot 1</option>
                    <option value="2">Slot 2</option>
                    <option value="3">Slot 3</option>
                    <option value="4">Slot 4</option>
                    <option value="5">Slot 5</option>
                    <option value="6">Slot 6</option>
                    <option value="7">Slot 7</option>
                    <option value="8">Slot 8</option>
                </select>
                <button onclick="handleSaveSlot()" title="Save current tone to selected slot">💾 Save</button>
            </div>
            
            <div class="storage-section">
                <label><strong>Manage All Slots: </strong></label>
                <button onclick="exportAllSlots()" title="Export all 8 slots to a JSON file">📥 Export All Slots</button>
                <button onclick="importAllSlots()" title="Import slots from a JSON file">📤 Import All Slots</button>
            </div>
            
            <div id="slotInfo" class="slot-info"></div>
        </div>
    </div>

    <div class="random-controls">
        <button 
            id="randomConfigToggleBtn" 
            class="random-toggle-btn" 
            aria-controls="randomConfigContent" 
            aria-expanded="false"
            onclick="toggleRandomConfigSection()"
            title="Show/hide random tone configuration">
            <span class="toggle-icon" aria-hidden="true"></span>
            <span class="toggle-text">Show Config</span>
        </button>
        
        <div id="randomConfigContent" class="random-content" aria-hidden="true" style="display: none;">
            <div class="random-section">
                <label for="randomConfigTextarea"><strong>Random Tone Configuration (JSON): </strong></label>
                <textarea id="randomConfigTextarea" class="config-textarea" spellcheck="false"></textarea>
            </div>
            
            <div class="random-section">
                <label><strong>Manage Configuration: </strong></label>
                <button onclick="exportRandomConfig()" title="Export configuration to a JSON file" aria-label="Export Config">📥 Export Config</button>
                <button onclick="importRandomConfig()" title="Import configuration from a JSON file" aria-label="Import Config">📤 Import Config</button>
            </div>
        </div>
    </div>

    <label class="editor-label" for="mmlInput">MML Input (Music Macro Language):</label>
    <textarea id="mmlInput" spellcheck="false" placeholder="Enter MML notation (e.g., 'cdefgab' for scale, 'c;e;g' for chord). Press Play to convert and play."></textarea>

    <label class="editor-label" for="toneEditor">Simple Tone Editor (auto-updates JSON below):</label>
    <textarea id="toneEditor" spellcheck="false" placeholder="Enter tone parameters (one line per operator, then global params). Load a preset tone to see format examples."></textarea>
    
    <label class="editor-label" for="jsonEditor">Edit Events JSON:</label>
    <textarea id="jsonEditor" spellcheck="false"></textarea>
    
    <div class="info" id="info">
        Initializing...
    </div>
    
    <div class="oscilloscope-container">
        <button 
            id="oscilloscopeToggleBtn" 
            class="oscilloscope-toggle-btn" 
            aria-controls="oscilloscopeContent" 
            aria-expanded="false"
            onclick="toggleOscilloscopeSection()"
            title="Show/hide waveform visualizer">
            <span class="toggle-icon" aria-hidden="true"></span>
            <span class="toggle-text">Show Waveform Visualizer</span>
        </button>
        
        <div id="oscilloscopeContent" class="oscilloscope-content" aria-hidden="true" style="display: none;">
            <canvas id="oscilloscope" width="800" height="400" aria-label="Waveform visualization canvas"></canvas>
        </div>
    </div>

    <div class="history-controls">
        <button
            id="historyToggleBtn"
            class="history-toggle-btn"
            aria-controls="historyContent"
            aria-expanded="false"
            onclick="toggleHistorySection()"
            title="Show/hide play history">
            <span class="toggle-icon" aria-hidden="true"></span>
            <span class="toggle-text">Show History (0)</span>
        </button>

        <div id="historyContent" class="history-content" aria-hidden="true" style="display: none;">
            <div class="history-toolbar">
                <button onclick="clearHistoryAndRefresh()" class="history-clear-btn" title="Clear all history">🗑 Clear History</button>
            </div>
            <div id="historyList" class="history-list"></div>
        </div>
    </div>

    <div class="favorites-controls">
        <button
            id="favoritesToggleBtn"
            class="favorites-toggle-btn"
            aria-controls="favoritesContent"
            aria-expanded="false"
            onclick="toggleFavoritesSection()"
            title="Show/hide favorites">
            <span class="toggle-icon" aria-hidden="true"></span>
            <span class="toggle-text">Show Favorites (0)</span>
        </button>

        <div id="favoritesContent" class="favorites-content" aria-hidden="true" style="display: none;">
            <div class="history-toolbar">
                <button onclick="clearFavoritesAndRefresh()" class="history-clear-btn" title="Clear all favorites">🗑 Clear Favorites</button>
            </div>
            <div id="favoritesList" class="history-list"></div>
        </div>
    </div>
    
    <!-- Load cat-oscilloscope library locally -->
    <script type="module">
        // Import cat-oscilloscope library from local file
        import('./lib/cat-oscilloscope.mjs')
            .then(module => {
                window.Oscilloscope = module.Oscilloscope;
                window.BufferSource = module.BufferSource;
                console.log('cat-oscilloscope library loaded');
            })
            .catch(error => {
                console.error('Failed to load cat-oscilloscope library:', error);
            });
    </script>
    
    <!-- Load compiled TypeScript modules -->
    <script type="module" src="dist/index.js"></script>
    
    <!-- External WASM script (loaded last to use Module from TypeScript) -->
    <script defer src="ym2151.js"></script>
    
    <div id="renderOverlay" class="render-overlay" aria-live="assertive" aria-hidden="true">
        <div class="render-overlay__content">
            <div class="render-overlay__spinner" aria-hidden="true"></div>
            <div class="render-overlay__text">Now rendering...</div>
        </div>
    </div>
    
    <!-- Repository links -->
    <div class="repo-links">
        <a href="https://github.com/cat2151/web-ym2151" target="_blank" rel="noopener noreferrer">GitHub Repository</a>
        <a href="demo-library/">Library Demo</a>
    </div>
</body>
</html>
