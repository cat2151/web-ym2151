name: Call Auto Translate README

on:
  push:
    paths:
      - 'README.ja.md'
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  call-shared-workflow:
    uses: cat2151/github-actions/.github/workflows/translate-readme.yml@main
    with:
      target-branch: ${{ github.ref_name }}
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
