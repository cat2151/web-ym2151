name: Create Issue on Actions Failure

on:
  workflow_run:
    workflows:
      - Build and Deploy
    types:
      - completed

jobs:
  create-issue:
    concurrency:
      group: ci-issue-${{ github.event.workflow_run.name }}-${{ github.event.workflow_run.head_branch || 'unknown' }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      issues: write
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create issue for failed workflow
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/create_failure_issue.py
